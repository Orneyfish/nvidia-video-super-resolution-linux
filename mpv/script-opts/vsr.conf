# vsr.conf - options of mpv/vsr.lua (RTX video super resolution).
#
# Install as <mpv config dir>/script-opts/vsr.conf. Every key can also be set on the command line:
#   mpv --script-opts=vsr-quality=high,vsr-ac_only=no file.mkv
# The values below are the defaults (a line that is commented out keeps its default).
#
# When does SR turn on by itself? When ALL of these hold (re-evaluated when fullscreen, the file, its video
# parameters or the power source change): enabled=yes; fullscreen; a real video track (not a picture or cover art);
# source height >= min_height; the picture fitted to the display (aspect kept) must come out larger than the
# source, so SR never downscales and ultrawide/"already fills the display" video is left alone; SDR (no PQ/HLG,
# no BT.2020); not interlaced (unless mpv's own deinterlacer is on); not rotated; a YUV pixel format; on AC power
# if ac_only=yes. Otherwise the filter is removed again and the original video plays.

# Master switch for the automatic mode. With "no" nothing happens by itself, but the toggle key (Ctrl+s) still
# turns SR on for the current file.
#enabled=yes

# Only run SR on AC power: the RTX draws about 150 W while it works. Mains and USB-C PD supplies count as AC
# (/sys/class/power_supply/*/online). On battery the OSD says "SR off: on battery" once per file.
#ac_only=yes
# Seconds between power-source checks (the source is also checked whenever something else is re-evaluated).
#check_interval=30

# Smallest source height (pixels) worth upscaling.
#min_height=360
# Do nothing if the fitted picture would be less than this much (2% = 0.02) larger than the source, e.g. a
# 2540x1426 video on a 2560x1440 display.
#slop=0.02

# Quality: auto | bicubic | low | medium | high | ultra | streaming_medium | streaming_ultra
# auto lets the plugin pick by source height and frame rate: <=540p ULTRA, 541-800p HIGH, >800p MEDIUM
# (very high frame rates one level lower). The adaptive step-down starts from this level.
#quality=auto
# Concurrent libnvvsr contexts (1-4); every extra one costs ~250 MiB of VRAM, one already saturates the GPU.
#pool=1
# Strength 0..1 of the SR effect; empty = the SDK default.
#strength=

# Adaptive quality: when at least adaptive_drops frames are dropped (frame-drop-count + decoder-frame-drop-count
# + vo-delayed-frame-count) within adaptive_window seconds, SR restarts one level lower
# (ULTRA > HIGH > MEDIUM > LOW > BICUBIC) and never goes back up during the same file. If BICUBIC cannot keep up
# either, SR is switched off for the file. Nothing is judged for `settle` seconds after (re)starting, nor while
# paused, seeking, buffering or idle.
#adaptive=yes
#adaptive_window=5
#adaptive_drops=10
#settle=2

# Hardware decoding. The VapourSynth filter needs frames in system memory. "copy" (default): while SR is active
# switch the user's hwdec to its "-copy" variant (vaapi -> vaapi-copy, nvdec -> nvdec-copy, auto -> auto-copy;
# nothing changes when hwdec is "no" or already a copy variant) and restore the original value when SR stops
# (mpv re-initialises the decoder and keeps the playback position). "keep": leave hwdec alone and let mpv download
# the frames itself. Anything else is used as the hwdec value while SR is active, e.g. "nvdec-copy".
#hwdec=copy

# 10-bit / 4:2:2 / 4:4:4 YUV sources: "yes" lets mpv convert them to 8-bit 4:2:0 in front of the filter (the SR
# engine is 8-bit); "no" skips SR for them. (Left alone, the plugin would pass such video through unscaled.)
#convert_10bit=yes

# After a failure (filter error, plugin or GPU unavailable, no scaled frames within confirm_timeout seconds)
# SR stays off for that file and the OSD says "SR failed, using original". "yes": try again on the next file.
#retry_on_next_file=yes
#confirm_timeout=8

# On-screen feedback: a small, semi-transparent badge with one or two words ("SR", "SR off", "SR high",
# "SR failed", "SR off, battery") in a screen corner. Sizes, reasons and details go to the log only (mpv -v).
# "no" switches the badge off completely; Ctrl+Alt+s toggles it while playing.
#osd=yes
# Text size at a 1280x720 scale (11 is about 2% of the screen height) and how opaque it is (0.1 .. 1).
#osd_size=11
#osd_opacity=0.55
# Where: numpad layout, 9 top right, 7 top left, 3 bottom right, 1 bottom left, 8 top centre, 2 bottom centre.
#osd_position=9
# Seconds the badge stays up; 0 = until the next message.
#osd_duration=1.5
# Refresh interval (seconds) of the stats overlay.
#stats_interval=1

# VapourSynth script; empty = vsr.vpy next to vsr.lua, then ~~/scripts/vsr.vpy, ~~/vsr.vpy.
#vpy=
# Frames mpv buffers/renders concurrently in the filter.
#buffered_frames=4
#concurrent_frames=2
# Power supply directory (tests point this at a fake one).
#power_dir=/sys/class/power_supply

# Key bindings (registered with mp.add_key_binding, so input.conf overrides them; the binding names are
# vsr/toggle, vsr/quality, vsr/stats):
#   Ctrl+s        toggle SR for the current file (A/B compare). Off sticks until toggled on or the next file.
#   Ctrl+Shift+s  cycle the quality auto > ultra > high > medium > low > bicubic for the current file
#   Alt+s         show/hide the stats overlay (state, quality, sizes, filter fps, drops, hwdec, power)
#   Ctrl+Alt+s    switch the small status badge on/off
# Rebind in input.conf, e.g.:   F8 script-binding vsr/toggle
#
# State for other scripts: user-data/vsr/{state,reason,quality,steps,hwdec,stats}  (state: off|starting|on|failed).
# Display size, when mpv itself reports none (--vo=null): the property user-data/vsr/display ("WxH"), then the
# environment variable NVVSR_DISPLAY=2560x1440 (which vsr.vpy reads too).
